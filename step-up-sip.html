<body class="flex flex-col min-h-screen">
    <header class="sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="logo text-2xl font-bold text-white">MoneyMindTool</div>
            <nav class="flex space-x-4">
                <a href="/index.html" class="text-white hover:text-orange-500 font-medium">Home</a>
                <a href="/all-calculators.html" class="text-white hover:text-orange-500 font-medium">Calculators</a>
            </nav>
        </div>
    </header>
    
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <section class="mb-8">
            <h1 class="text-3xl font-semibold text-indigo-900 text-center mb-6">Step-Up SIP Calculator</h1>
            <p class="text-center text-gray-600 mb-4">Plan your wealth creation effectively by increasing your mutual fund SIP annually. Use our free Step-Up SIP calculator for accurate return projections.</p>
        </section>
        
        <section class="bg-white rounded-lg shadow-md p-6 mb-6 border border-indigo-50">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-800 font-medium">Initial Monthly SIP (₹):</label>
                    <input type="number" id="monthly" value="10000" class="w-full p-2 border border-indigo-200 rounded-lg">
                </div>
                <div>
                    <label class="block text-gray-800 font-medium">Annual Step-Up (%):</label>
                    <input type="number" id="stepup" value="10" class="w-full p-2 border border-indigo-200 rounded-lg">
                </div>
                <div>
                    <label class="block text-gray-800 font-medium">Expected Return (% p.a):</label>
                    <input type="number" id="rate" value="12" class="w-full p-2 border border-indigo-200 rounded-lg">
                </div>
                <div>
                    <label class="block text-gray-800 font-medium">Investment Period (Years):</label>
                    <input type="number" id="years" value="15" class="w-full p-2 border border-indigo-200 rounded-lg">
                </div>
            </div>
            <div class="mt-6 text-center">
                <button onclick="calculateStepUp()" class="bg-orange-500 text-white px-8 py-3 rounded-lg font-bold hover:bg-orange-600">Calculate Returns</button>
            </div>
        
        </section>
        
        <section id="resultsCard" class="hidden bg-white rounded-lg shadow-md p-6 mb-6 border border-indigo-50 text-center">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Calculation Results</h2>
            <div id="result"></div>
        </section>
    </main>
    
    <footer class="mt-auto bg-indigo-900 text-white text-center py-6 ">
        <p class="text-sm opacity-80 mt-2">© 2026 Digicreature Technologies. All Rights Reserved.</p>
    </footer>
    
    <script>
        
        function calculateStepUp() {
            let monthly = parseFloat(document.getElementById('monthly').value) || 0;
            let stepup = parseFloat(document.getElementById('stepup').value) || 0;
            let rate = parseFloat(document.getElementById('rate').value) / 100 / 12;
            let years = parseFloat(document.getElementById('years').value) || 0;
            
            let balance = 0;
            let invested = 0;
            let currentMonthly = monthly;
            
            for(let y=1; y<=years; y++) {
                for(let m=1; m<=12; m++) {
                    balance += currentMonthly;
                    balance += balance * rate;
                    invested += currentMonthly;
                }
                currentMonthly += currentMonthly * (stepup / 100);
            }
            
            document.getElementById('result').innerHTML = `
                <div class="text-2xl font-bold text-indigo-900 mb-2">Expected Maturity: ₹${Math.round(balance).toLocaleString()}</div>
                <div class="text-gray-700 mt-2">Total Invested: ₹${Math.round(invested).toLocaleString()}</div>
                <div class="text-gray-700">Estimated Profit: ₹${Math.round(balance - invested).toLocaleString()}</div>
            `;
            document.getElementById('resultsCard').classList.remove('hidden');
        }
        
    </script>
